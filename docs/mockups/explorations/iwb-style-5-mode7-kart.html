<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Kart (Mode 7)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--background, #fff); color: var(--foreground, #171717);
         font-family: var(--font-sans, system-ui, sans-serif); }
  .intro { max-width: 760px; margin: 0 auto 14px; }
  .intro h1 { font-size: 17px; margin: 0 0 4px; }
  .intro p { margin: 0 0 8px; font-size: 13px; color: var(--muted-foreground, #666); line-height: 1.45; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border, #ddd);
          background: var(--card, #fafafa); color: var(--card-foreground, #222); display: inline-flex; gap: 5px; align-items: center; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
  .frames { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
  figure { margin: 0; }
  figcaption { font-size: 12px; text-align: center; margin-top: 8px; color: var(--muted-foreground, #666); }
  .notes { max-width: 760px; margin: 14px auto 0; font-size: 12px; color: var(--muted-foreground, #666); line-height: 1.5; }
  .notes b { color: var(--foreground, #171717); }

  /* ---------- phone mock (fixed palette lives under .m) ---------- */
  .phone { width: 360px; padding: 12px; border-radius: 34px; background: #1b1b1f; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .screen { position: relative; width: 336px; height: 700px; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; }
  .bar { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
  .logo { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .why { white-space: nowrap; text-decoration: none; cursor: pointer; }
  .map { position: relative; flex: none; width: 336px; }
  .map canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .legend { position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; align-items: center; padding: 4px 7px; z-index: 3; }
  .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 3px; }
  .zoomctl { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 3; }
  .zoomctl span { width: 30px; height: 30px; display: grid; place-items: center; }
  .bob { position: absolute; z-index: 4; animation: bob 1s steps(2) infinite; pointer-events: none; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .panel { flex: 1; display: flex; flex-direction: column; gap: 9px; padding: 10px 12px 14px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 4px 10px; line-height: 1.15; cursor: pointer; user-select: none; text-align: center; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .tracker .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .meter { height: 12px; position: relative; overflow: hidden; }
  .meter > b { position: absolute; left: 0; top: 0; bottom: 0; }
  .card { display: flex; gap: 10px; }
  .card canvas { width: 96px; height: 72px; image-rendering: pixelated; flex: none; }
  .card .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .small { font-size: 11px; opacity: .8; }
  .report { align-self: flex-start; text-decoration: underline; cursor: pointer; }
  .covered { opacity: .55; cursor: not-allowed; }

.t-kart .screen { background: linear-gradient(#3b2a8f, #7a3d9e 30%, #ff6f91 70%, #ffb36b); font-family: "Pixelify Sans", sans-serif; color: #fff; }
.t-kart .bar { font-family: "Jersey 10"; font-size: 24px; text-shadow: 2px 2px 0 #2a1f5a; }
.t-kart .logo-txt { letter-spacing: .5px; }
.t-kart .logo-ico::before { content: "🏁"; font-size: 16px; }
.t-kart .why { font-family: "Pixelify Sans"; font-size: 12px; color: #fff4b0; text-decoration: underline; text-shadow: 1px 1px 0 #2a1f5a; }
.t-kart .legend { background: rgba(42,31,90,.8); border-radius: 10px; font-size: 11px; padding: 4px 8px; }
.t-kart .zoomctl span { background: #ffd84a; color: #2a1f5a; border-radius: 10px; box-shadow: 0 3px 0 #b8860b; font: 700 18px "Pixelify Sans"; }
.t-kart .panel { background: #2a1f5a; }
.t-kart .btn { border-radius: 14px; font-family: "Jersey 10"; font-size: 22px; background: #5a4bb5; box-shadow: 0 4px 0 #1a1240; }
.t-kart .btn.primary { background: #ffd84a; color: #2a1f5a; box-shadow: 0 4px 0 #b8860b; }
.t-kart .btn.secondary { background: #e8433a; box-shadow: 0 4px 0 #8f1f18; }
.t-kart .tracker .tl { font-family: "Jersey 10"; font-size: 20px; color: #ffd84a; }
.t-kart .meter { background: #1a1240; border-radius: 8px; height: 14px; }
.t-kart .meter b { background: linear-gradient(90deg, #e8433a, #ffd84a 60%, #7dff3a); border-radius: 8px; }
.t-kart .card { background: #3b2d7a; border-radius: 12px; padding: 8px; }
.t-kart .card canvas { border-radius: 6px; } .t-kart .ct { font-weight: 700; }
.t-kart .covered { background: #5a5a6a; color: #c8c8d4; box-shadow: 0 4px 0 #333; font-family: "Pixelify Sans"; font-size: 13px; opacity: 1; }
.t-kart .report { color: #fff4b0; }

</style>
</head>

    if (st.casing) strokeLines(ctx, byClass[cls], P, st.w + st.casing, C.roadCasing, null, perDepth);
  }
  for (const cls of ['7', '6', '5', '4', '3', '2', '1']) {
    const st = S.roads[cls]; if (!st || !byClass[cls]) continue;
    strokeLines(ctx, byClass[cls], P, st.w, C[st.col], st.dash, perDepth);
  }
  if (S.rail) { strokeLines(ctx, g.rail, P, S.rail.w + (S.rail.casing || 0), C.railCasing || C.rail, null, perDepth); strokeLines(ctx, g.rail, P, S.rail.w, C.rail, S.rail.dash, perDepth); }

  // mask + boundary line canvases
  const mk = offscreen(cw, ch), mc = mk.getContext('2d', { willReadFrequently: true });
  mc.setTransform(1 / px, 0, 0, 1 / px, 0, 0); mc.fillStyle = '#fff'; mc.beginPath(); trace(mc, g.lga, P, true); mc.fill();
  const ln = offscreen(cw, ch), lc = ln.getContext('2d', { willReadFrequently: true });
  lc.setTransform(1 / px, 0, 0, 1 / px, 0, 0); lc.strokeStyle = '#fff'; lc.lineWidth = S.lga.w; lc.setLineDash(S.lga.dash || []); lc.lineJoin = 'round'; lc.beginPath(); trace(lc, g.lga, P, true); lc.stroke();

  const img = ctx.getImageData(0, 0, cw, ch), d = img.data;
  const m = mc.getImageData(0, 0, cw, ch).data, l = ln.getContext('2d').getImageData(0, 0, cw, ch).data;
  const pal = T.palette.map(hex), greys = T.greys.map(hex), lineC = hex(C.lga);
  const hz = view.horizon != null ? Math.floor(view.horizon / px) : -1;
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const i = (y * cw + x) * 4;
    let col;
    if (y > hz && l[i + 3] > 100) col = lineC;
    else if (y <= hz || m[i] > 127) {
      const dd = T.dither && y <= hz ? BAYER[(y & 3) * 4 + (x & 3)] * T.dither : 0;
      col = nearest(pal, d[i] + dd, d[i + 1] + dd, d[i + 2] + dd);
    } else {
      const lum = (0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]) / 255;
      let t = lum * (greys.length - 1) + (T.greyDither ? BAYER[(y & 3) * 4 + (x & 3)] * T.greyDither : 0);
      if (T.greyPattern === 'scan' && (y & 1)) t -= 0.6;
      if (T.greyPattern === 'hatch' && ((x + y) % 4 === 0)) t -= 0.7;
      col = greys[Math.max(0, Math.min(greys.length - 1, Math.round(t)))];
    }
    d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  }
  // decorative stamps (inside the council only)
  const inside = (x, y) => m[(y * cw + x) * 4] > 127;
  for (const st of (T.stamps[frame] || [])) {
    const need = hex(C[st.on]), cols = Object.fromEntries(Object.entries(st.colors).map(([k, v]) => [k, hex(v)]));
    let n = 0;
    for (let y = st.oy || 0; y < ch; y += st.gy) for (let x = ((y / st.gy) & 1 ? st.gx >> 1 : 0) + (st.ox || 0); x < cw; x += st.gx) {
      if (!inside(x, y) || (y <= hz)) continue;
      if (st.rand && ((x * 73856093) ^ (y * 19349663)) % 100 > st.rand) continue;
      if (stamp(d, cw, ch, x, y, st.sprite, cols, need)) n++;
    }
  }
  ctx.putImageData(img, 0, 0);
  if (T.skyline && view.horizon != null && view.horizon > 0 && (T.skylineFrames || ['overview']).includes(frame)) drawSkyline(ctx, W, view.horizon);
  return { view, cw, ch, mc };
}

function drawSkyline(ctx, W, hz) {
  // tiny generic CBD silhouette on the horizon, drawn in low-res pixels
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  const px = T.px, base = Math.floor(hz / px), cx = Math.floor(W / px / 2);
  ctx.fillStyle = T.skyline;
  const towers = [[-14, 6, 3], [-10, 9, 2], [-7, 13, 3], [-3, 18, 2], [0, 11, 3], [3, 15, 2], [6, 8, 3], [9, 12, 2], [12, 5, 3]];
  for (const [dx, h, w] of towers) ctx.fillRect(cx + dx, base - h, w, h);
  ctx.fillRect(cx - 1, base - 23, 1, 5); // spire
  // little arch bridge silhouette off to the left (north-east)
  for (let i = 0; i <= 18; i++) { const t = i / 18, yy = Math.round(5 * Math.sin(Math.PI * t)); ctx.fillRect(cx - 44 + i, base - 2 - yy, 1, 1); }
  ctx.fillRect(cx - 46, base - 2, 22, 1); ctx.fillRect(cx - 46, base - 4, 1, 3); ctx.fillRect(cx - 25, base - 4, 1, 3);
  ctx.restore();
}

// ---------- overlay (labels + pins) ----------
const PIN = [
  '....XXXXX....', '..XXCCCCCXX..', '.XCWCCCCCCCX.', '.XCWCCCCCCCX.', 'XCCCCCCCCCCCX', 'XCCCCCCCCCCCX', 'XCCCCCCCCCCCX',
  'XCCCCCCCCCCCX', '.XCCCCCCCCCX.', '.XCCCCCCCCCX.', '..XXCCCCCXX..', '...XXCCCXX...', '....XXCXX....', '.....XXX.....', '......X......'];
const GLYPH = { lime: ['X..', 'X..', 'X..', 'X..', 'XXX'], hello: ['X.X', 'X.X', 'XXX', 'X.X', 'X.X'], ario: ['.X.', 'X.X', 'XXX', 'X.X', 'X.X'] };
function drawPin(ctx, x, y, op, u, shadow) {
  const o = T.ops[op], w = PIN[0].length, h = PIN.length;
  const x0 = Math.round(x - (w * u) / 2), y0 = Math.round(y - h * u);
  if (shadow) { ctx.fillStyle = T.colors.pinShadow; ctx.fillRect(x0 + 3 * u, y0 + (h - 1) * u + u, 7 * u, u); ctx.fillRect(x0 + 4 * u, y0 + (h) * u + u, 5 * u, u); }
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const c = PIN[j][i]; if (c === '.') continue;
    ctx.fillStyle = c === 'X' ? o.line : c === 'W' ? o.hi : o.fill; ctx.fillRect(x0 + i * u, y0 + j * u, u, u);
  }
  const gl = GLYPH[op]; ctx.fillStyle = o.glyph;
  for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (gl[j][i] === 'X') ctx.fillRect(x0 + (5 + i) * u, y0 + (3 + j) * u, u, u);
}

function textOut(ctx, txt, x, y, col, halo, hw) {
  if (halo) { ctx.fillStyle = halo; for (let dx = -hw; dx <= hw; dx++) for (let dy = -hw; dy <= hw; dy++) if (dx || dy) ctx.fillText(txt, x + dx, y + dy); }
  ctx.fillStyle = col; ctx.fillText(txt, x, y);
}

function overlay(frame, el, W, H, r) {
  const can = el.querySelector('canvas.over'), dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
  can.width = W * dpr; can.height = H * dpr; can.style.width = W + 'px'; can.style.height = H + 'px';
  const ctx = can.getContext('2d'); ctx.scale(dpr, dpr); ctx.imageSmoothingEnabled = false;
  const P = r.view.P, g = G[frame], L = T.labels, placed = [];
  const hit = (b) => placed.some(q => !(b[2] < q[0] || b[0] > q[2] || b[3] < q[1] || b[1] > q[3]));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const put = (txt, x, y, font, col, halo, hw, box, minF) => {
    ctx.font = font; const tw = ctx.measureText(txt).width, th = +((font.match(/(\d+)px/) || [0, 10])[1]);
    let b = null;
    for (const dy of [0, -13, 13, -24, 24]) {
      const c = [x - tw / 2 - 3, y + dy - th / 2 - 2, x + tw / 2 + 3, y + dy + th / 2 + 2];
      if (c[0] < 2 || c[2] > W - 2 || c[1] < 2 || c[3] > H - 2 || hit(c)) continue;
      b = c; y += dy; break;
    }
    if (!b) return false;
    if (box) { ctx.fillStyle = box.bg; ctx.fillRect(Math.round(b[0]), Math.round(b[1]), Math.round(b[2] - b[0]), Math.round(b[3] - b[1])); if (box.line) { ctx.strokeStyle = box.line; ctx.lineWidth = 1; ctx.strokeRect(Math.round(b[0]) + .5, Math.round(b[1]) + .5, Math.round(b[2] - b[0]) - 1, Math.round(b[3] - b[1]) - 1); } }
    textOut(ctx, txt, Math.round(x), Math.round(y), col, box ? null : halo, hw);
    placed.push(b); return true;
  };
  // reserve UI corners and pin footprints so labels never sit under a pin
  placed.push([0, 0, frame === 'overview' ? 250 : 40, 30], [W - 44, 0, W, 80]);
  for (const pp of g.pins) { const q = P(pp[0], pp[1]); if (q) { const hw = 7 * T.pinPx * Math.max(0.5, Math.min(1.5, q[2])); placed.push([q[0] - hw, q[1] - 2.2 * hw, q[0] + hw, q[1] + 2]); } }
  const fmt = s => L.upper ? s.toUpperCase() : s;
  if (frame === 'overview') {
    const subs = g.suburbs.filter(s => s.l && s.f > 0.5).sort((a, b) => b.l[2] - a.l[2]);
    for (const s of subs) { const p = P(s.l[0], s.l[1]); if (!p) continue; put(fmt(s.n), p[0], p[1], L.suburbFont, L.suburbCol, L.halo, L.haloW, L.suburbBox, 0); }
  } else {
    // suburb names (faint, big) using point-in-path sampling
    for (const s of g.suburbs) {
      const path = new Path2D(); const tmp = offscreen(1, 1).getContext('2d');
      let sx = 0, sy = 0, n = 0; const pr = []; for (let i = 0; i < s.r[0].length; i += 2) { const p = P(s.r[0][i], s.r[0][i + 1]); if (p) pr.push(p); }
      if (pr.length < 3) continue; path.moveTo(pr[0][0], pr[0][1]); for (const p of pr) path.lineTo(p[0], p[1]); path.closePath();
      for (let y = 20; y < H; y += 18) for (let x = 12; x < W; x += 18) if (tmp.isPointInPath(path, x, y)) { sx += x; sy += y; n++; }
      if (n > 40) { const inside = s.f > 0.2; put(fmt(s.n), sx / n, sy / n, L.areaFont, inside ? L.areaCol : L.areaColOut, L.areaHalo, 1, null, 0); }
    }
    // street names: longest visible polyline per name
    const best = {};
    for (const rd of g.roads) {
      if (!rd.n || rd.c > 6) continue; let len = 0, pts = [];
      for (let i = 0; i < rd.p.length; i += 2) { const p = P(rd.p[i], rd.p[i + 1]); if (p && p[0] > 0 && p[0] < W && p[1] > 0 && p[1] < H) pts.push(p); }
      for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (len > 40 && (!best[rd.n] || best[rd.n].len < len)) best[rd.n] = { len, pts, c: rd.c };
    }
    const order = Object.entries(best).sort((a, b) => a[1].c - b[1].c || b[1].len - a[1].len);
    for (const [name, b] of order) {
      // walk to the middle of the polyline
      let half = b.len / 2, x = b.pts[0][0], y = b.pts[0][1], f = b.pts[0][2];
      for (let i = 1; i < b.pts.length; i++) { const seg = Math.hypot(b.pts[i][0] - b.pts[i - 1][0], b.pts[i][1] - b.pts[i - 1][1]); if (half <= seg) { const t = half / seg; x = b.pts[i - 1][0] + t * (b.pts[i][0] - b.pts[i - 1][0]); y = b.pts[i - 1][1] + t * (b.pts[i][1] - b.pts[i - 1][1]); f = b.pts[i][2]; break; } half -= seg; }
      if (f < 0.7) continue;
      put(fmt(name), x, y, b.c <= 4 ? L.streetFontMajor : L.streetFont, L.streetCol, L.halo, L.haloW, L.streetBox, 0);
    }
  }
  // pins
  const u = T.pinPx;
  const pins = g.pins.map((p, i) => { const q = P(p[0], p[1]); return q ? { x: q[0], y: q[1], f: q[2], op: p[2], i } : null; }).filter(Boolean).sort((a, b) => a.y - b.y);
  for (const p of pins) {
    if (frame === 'zoom' && p.i === 0) continue; // the selected pin is drawn separately so it can bob
    const uu = Math.max(1, Math.round(u * (p.f > 1.3 ? 1.5 : p.f < 0.75 ? 0.5 : 1)));
    drawPin(ctx, p.x, p.y, p.op, uu, true);
  }
  if (frame === 'zoom') {
    const sel = g.pins[0], q = P(sel[0], sel[1]);
    if (q) {
      const uu = u + 1, w = PIN[0].length * uu, h = PIN.length * uu;
      const bob = document.createElement('canvas'); bob.className = 'bob'; bob.width = (w + 4) * dpr; bob.height = (h + 4) * dpr;
      bob.style.width = (w + 4) + 'px'; bob.style.height = (h + 4) + 'px'; bob.style.left = Math.round(q[0] - w / 2 - 2) + 'px'; bob.style.top = Math.round(q[1] - h - 2) + 'px';
      const bc = bob.getContext('2d'); bc.scale(dpr, dpr); drawPin(bc, w / 2 + 2, h + 2, sel[2], uu, false); el.appendChild(bob);
      // selection ring
      ctx.strokeStyle = T.colors.select; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.ellipse(Math.round(q[0]), Math.round(q[1]) + 2, 16, 6, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
  }
}

// ---------- the bike photo (pixel art, quantised to the theme palette) ----------
function photo() {
  const c = document.getElementById('photo'), x = c.getContext('2d', { willReadFrequently: true });
  const P = T.photo;
  x.fillStyle = P.sky; x.fillRect(0, 0, 48, 14);
  x.fillStyle = P.wall; x.fillRect(0, 6, 48, 9);
  x.fillStyle = P.path; x.fillRect(0, 15, 48, 21);
  x.fillStyle = P.kerb; x.fillRect(0, 30, 48, 2);
  x.fillStyle = P.road; x.fillRect(0, 32, 48, 4);
  for (let i = 0; i < 48; i += 6) { x.fillStyle = P.wallLine; x.fillRect(i, 6, 1, 9); }
  // bike lying on its side across the footpath
  x.strokeStyle = P.tyre; x.lineWidth = 2;
  x.beginPath(); x.ellipse(13, 24, 7, 4, 0, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.ellipse(35, 24, 7, 4, 0, 0, Math.PI * 2); x.stroke();
  x.strokeStyle = P.frame; x.lineWidth = 2;
  x.beginPath(); x.moveTo(13, 24); x.lineTo(22, 20); x.lineTo(31, 21); x.lineTo(35, 24); x.moveTo(22, 20); x.lineTo(25, 25); x.lineTo(13, 24); x.moveTo(31, 21); x.lineTo(33, 16); x.stroke();
  x.fillStyle = P.frame; x.fillRect(20, 18, 5, 2); x.fillStyle = P.tyre; x.fillRect(31, 15, 6, 1);
  x.fillStyle = P.basket; x.fillRect(35, 14, 5, 3);
  const pal = T.palette.concat(T.greys, T.photoPal || []).map(hex), img = x.getImageData(0, 0, 48, 36), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const col = nearest(pal, d[i], d[i + 1], d[i + 2]); d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255; }
  x.putImageData(img, 0, 0);
}

const ov = document.getElementById('map-overview'), zm = document.getElementById('map-zoom');
const r1 = renderMap('overview', ov, 336, T.mapH.overview, T.view.overview);
overlay('overview', ov, 336, T.mapH.overview, r1);
const r2 = renderMap('zoom', zm, 336, T.mapH.zoom, T.view.zoom);
overlay('zoom', zm, 336, T.mapH.zoom, r2);
photo();
if (T.captions) $$('figcaption').forEach((f, i) => { if (T.captions[i]) f.textContent = T.captions[i]; });
document.body.dataset.ready = '1';
})();
